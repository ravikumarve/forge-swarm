agents:
  allow_delegation: false
  max_iterations: 5
  quality_threshold: 8
  retry_on_below_threshold: true
  verbose: true
embeddings:
  base_url: http://localhost:11434
  model: nomic-embed-text:latest
  provider: ollama
llm:
  base_url: http://localhost:11434
  model: meta/llama-3.1-8b-instruct
  num_ctx: 8192
  provider: nvidia_nim
  temperature: 0.7
  timeout: 120
memory:
  collection_name: improvement_lessons
  db_path: ./forge_swarm_memory
  max_context_results: 5
  max_lessons: 200
  min_score_to_store: 7
nvidia_nim:
  api_key: ""  # Set via NIM_API_KEY env var or Settings page
  base_url: https://integrate.api.nvidia.com/v1
  max_tokens: 8192
  model: meta/llama-3.1-8b-instruct
  models:
  - context: 256K
    description: 1T multimodal MoE for long-horizon coding, agentic tool use
    id: kimi-k2.6
    name: Kimi K2.6
    parameters: 1T
    specialty: multimodal
  - context: 128K
    description: High performing model for text generation, coding and agentic use
      cases
    id: mistral-medium-3.5-128b
    name: Mistral Medium 3.5 128B
    parameters: 128B
    specialty: coding
  - context: 1M
    description: 284B MoE model with 1M-token context optimized for fast coding and
      agents
    id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    parameters: 284B
    specialty: fast_coding
  - context: 1M
    description: Scales to 1M-token context windows with efficient MoE architecture
      for coding tasks
    id: deepseek-v4-pro
    name: DeepSeek V4 Pro
    parameters: 284B
    specialty: coding
  - context: 128K
    description: Flagship LLM for agentic workflows, coding, and long-horizon reasoning
      tasks
    id: glm-5.1
    name: GLM 5.1
    parameters: 230B
    specialty: agentic
  - context: 128K
    description: Multilingual agentic coding partner with stronger reasoning, tool
      use, and UI skills
    id: glm-4.7
    name: GLM 4.7
    parameters: 230B
    specialty: coding
  - context: 200K
    description: 230B-parameter text-to-text AI model excelling in coding, reasoning,
      and office tasks
    id: minimax-m2.7
    name: MiniMax M2.7
    parameters: 230B
    specialty: coding
  - context: 128K
    description: Dense 31B model delivering frontier reasoning for coding, agentic
      workflows
    id: gemma-4-31b-it
    name: Gemma 4 31B IT
    parameters: 31B
    specialty: reasoning
  - context: 256K
    description: Hybrid MoE model unifying instruct, reasoning, and coding with multimodal
      input
    id: mistral-small-4-119b-2603
    name: Mistral Small 4 119B
    parameters: 119B
    specialty: multimodal
  - context: 1M
    description: Open, efficient hybrid Mamba-Transformer MoE with 1M context, excelling
      in agentic reasoning, coding, planning
    id: nemotron-3-super-120b-a12b
    name: Nemotron 3 Super 120B
    parameters: 120B
    specialty: agentic
  temperature: 0.7
sandbox:
  allowed_imports:
  - os.path
  - json
  - math
  - datetime
  - collections
  - itertools
  - re
  - string
  - typing
  enabled: true
  max_output_lines: 100
  timeout_seconds: 10
ui:
  animate_progress: true
  layout: wide
  page_icon: "\u26A1"
  page_title: "\u26A1 Forge Swarm"
  show_agent_avatars: true
  theme: dark
